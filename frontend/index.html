<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Business Market Monitor — Track raw material prices and market news for your business.">
  <meta name="robots" content="noindex, nofollow">

  <title>Business Market Monitor</title>

  <!-- Preconnect to Google Fonts for faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Global CSS — load order matters (Doc 3 §2.1) -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/utilities.css">

  <!-- Font Awesome (icons) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkWQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer">

  <style>
    /* Inline loading indicator shown before JS module resolves */
    .root-loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0d1117;
      flex-direction: column;
      gap: 20px;
    }
    .root-loading__spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: root-spin 0.7s linear infinite;
    }
    .root-loading__text {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      color: #8b949e;
    }
    @keyframes root-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .root-loading__spinner { animation: none; }
    }
  </style>
</head>
<body>
  <!--
    Application entry point.
    This page is intentionally minimal — the redirect module below
    routes authenticated users to dashboard and unauthenticated users to login.
    It is never seen by end users for more than a brief moment.
  -->

  <div class="root-loading" role="status" aria-label="Loading application">
    <div class="root-loading__spinner" aria-hidden="true"></div>
    <p class="root-loading__text">Loading…</p>
  </div>

  <!-- Redirect controller — no UI logic here (Doc 3 §4.4) -->
  <script type="module" src="/js/pages/index.js"></script>
</body>
</html>
