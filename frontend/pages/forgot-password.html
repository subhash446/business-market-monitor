<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Request a password reset link for your Business Market Monitor account.">
  <meta name="robots" content="noindex, nofollow">

  <title>Reset Your Password — Business Market Monitor</title>

  <!-- Google Fonts — Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Global CSS (Doc 3 §2.1 load order) -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/utilities.css">

  <!-- Page-specific CSS -->
  <link rel="stylesheet" href="/css/pages/auth.css">

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkWQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer">
</head>
<body class="auth-layout">

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content" class="auth-container">

    <!-- Brand -->
    <div class="auth-brand">
      <div class="auth-logo-mark" aria-hidden="true">
        <i class="fa-solid fa-chart-column"></i>
      </div>
      <span class="auth-brand__name">Market Monitor</span>
    </div>

    <!-- Card -->
    <div class="auth-card">

      <div class="auth-card__header">
        <h1 class="auth-card__title">Reset Your Password</h1>
        <p class="auth-card__subtitle">
          Enter your email address and we'll send you a reset link if your account exists.
        </p>
      </div>

      <!--
        Form-level error: 429 rate-limit or network failure only.
        (200/404 both display the success state — Doc 4 §2.3, no enumeration)
      -->
      <div
        id="fp-form-error"
        class="form-alert form-alert--error"
        role="alert"
        aria-live="assertive">
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
        <span class="form-alert__message"></span>
      </div>

      <!-- Form area — hidden on success -->
      <div id="fp-form-area">
        <form id="fp-form" novalidate autocomplete="on">

          <!-- Email -->
          <div class="form-group">
            <label class="form-label form-label--required" for="fp-email">
              Email address
            </label>
            <input
              type="email"
              id="fp-email"
              name="email"
              class="form-control"
              placeholder="your@email.com"
              autocomplete="email"
              inputmode="email"
              required
              aria-required="true"
              aria-describedby="fp-email-error">
            <p id="fp-email-error"
               class="form-error"
               role="alert"
               aria-live="polite"></p>
          </div>

          <div class="auth-form__actions">
            <button
              type="submit"
              id="fp-submit-btn"
              class="btn btn--primary btn--full btn--lg">
              Send Reset Link
            </button>
          </div>

        </form>
      </div>

      <!--
        Success state — shown after any API call (200 or unmapped errors).
        SECURITY: This message is identical regardless of whether the email
        is registered, preventing email enumeration (Doc 4 §2.3).
      -->
      <div
        id="fp-success"
        class="success-message d-none"
        role="status"
        aria-live="polite"
        tabindex="-1">
        <div class="success-message__icon">
          <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
        </div>
        <p>If that email is registered, a reset link has been sent.</p>
        <a href="/pages/login.html" class="btn btn--ghost btn--full mt-4">Back to Sign In</a>
      </div>

      <!-- Back to login (always visible) -->
      <div class="auth-card__footer">
        <a href="/pages/login.html">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          Back to Sign In
        </a>
      </div>

    </div>

    <p class="auth-footer">&copy; 2026 Business Market Monitor</p>

  </main>

  <script type="module" src="/js/pages/forgot-password.js"></script>

</body>
</html>
