<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Industry news articles for your business — Business Market Monitor.">
  <meta name="robots" content="noindex, nofollow">

  <title>Industry News — Business Market Monitor</title>

  <!-- Google Fonts — Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Global CSS -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/utilities.css">

  <!-- Page-specific CSS -->
  <link rel="stylesheet" href="/css/pages/news.css">

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkWQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer">
</head>
<body class="app-layout">

  <!-- Sidebar injected by nav.js -->
  <div id="nav-placeholder"></div>

  <div class="app-body">

    <!-- Top header bar -->
    <header class="app-header">
      <button
        class="app-header__hamburger"
        id="sidebar-toggle"
        type="button"
        aria-label="Toggle navigation"
        aria-expanded="false"
        aria-controls="sidebar">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
      <h1 class="app-header__page-title" id="page-title"></h1>
      <div class="app-header__actions">
        <span class="app-header__user-badge" id="header-user-initials" aria-label="Signed in"></span>
      </div>
    </header>

    <!-- Main content -->
    <main id="main-content" class="app-main">
      <a href="#main-content" class="skip-link">Skip to main content</a>

      <div class="page-container">

        <!-- ── Toolbar (Doc 4 §6.1) ───────────────────────────────────── -->
        <div class="news-toolbar">
          <div>
            <h2 class="news-toolbar__title">Industry News</h2>
            <!--
              industryName: from session.getCachedBusiness().industryName
              Set via textContent in news.js — never innerHTML
            -->
            <p class="page-subtitle" id="news-industry-label">
              Showing news for your industry
            </p>
          </div>
        </div>

        <!-- ── News list area ────────────────────────────────────────── -->
        <!--
          API: GET /api/v1/news?page=1&limit=20
          Response: {
            data: [{ id, title, url, sourceName, publishedAt }],
            meta: { page, limit, total, totalPages }
          }

          Each news card (.news-card):
            - title: <h3 class="news-card__title">
                <a href="{url}" target="_blank" rel="noopener noreferrer">{title}</a>
                <i class="fa-arrow-up-right-from-square">
              </h3>  — only when url is present
            - sourceName: <span class="news-card__source">
            - publishedAt: <time class="news-card__date" datetime="{publishedAt}">

          If url is null: plain title text, no link.
          No url or title set via innerHTML — textContent / .href property only.

          Empty state (expected in v1 — news ingestion is a backend stub):
            Icon: fa-newspaper
            Title: "No news available yet"
            No action button.

          Server filters by business.industry_id — no client-side category param.
        -->
        <div
          id="news-container"
          aria-live="polite"
          aria-label="Industry news articles">
          <!-- Populated by news.js -->
        </div>

        <!-- ── Pagination ─────────────────────────────────────────────── -->
        <div
          id="news-pagination"
          class="news-pagination"
          aria-label="News pagination">
        </div>

      </div>
      <!-- /.page-container -->
    </main>

  </div>
  <!-- /.app-body -->

  <script type="module" src="/js/pages/news.js"></script>
</body>
</html>
