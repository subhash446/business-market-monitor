<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Business Market Monitor to track raw material prices and market alerts.">
  <meta name="robots" content="noindex, nofollow">

  <title>Sign In — Business Market Monitor</title>

  <!-- Google Fonts — Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Global CSS (Doc 3 §2.1 load order) -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/utilities.css">

  <!-- Page-specific CSS -->
  <link rel="stylesheet" href="/css/pages/auth.css">

  <!-- Font Awesome (icons) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkWQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer">
</head>
<body class="auth-layout">

  <!-- Skip to main content (Doc 3 §10.2) -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content" class="auth-container">

    <!-- Brand -->
    <div class="auth-brand">
      <div class="auth-logo-mark" aria-hidden="true">
        <i class="fa-solid fa-chart-column"></i>
      </div>
      <span class="auth-brand__name">Market Monitor</span>
    </div>

    <!-- Login Card -->
    <div class="auth-card" role="main">

      <div class="auth-card__header">
        <h1 class="auth-card__title">Sign In</h1>
      </div>

      <!-- Session-expired banner (shown when ?reason=session_expired) -->
      <div
        id="session-expired-banner"
        class="alert-banner alert-banner--warning d-none"
        role="alert"
        aria-live="polite">
        <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
        <span class="alert-banner__message">Your session has expired. Please sign in again.</span>
      </div>

      <!-- Form-level error (401, 429, network) -->
      <div
        id="login-form-error"
        class="form-alert form-alert--error"
        role="alert"
        aria-live="assertive">
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
        <span class="form-alert__message"></span>
      </div>

      <!-- Login Form -->
      <form id="login-form" novalidate autocomplete="on">

        <!-- Email -->
        <div class="form-group">
          <label class="form-label form-label--required" for="login-email">
            Email address
          </label>
          <input
            type="email"
            id="login-email"
            name="email"
            class="form-control"
            placeholder="your@email.com"
            autocomplete="email"
            inputmode="email"
            required
            aria-required="true"
            aria-describedby="login-email-error">
          <p id="login-email-error"
             class="form-error"
             role="alert"
             aria-live="polite"></p>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label form-label--required" for="login-password">
            Password
          </label>
          <input
            type="password"
            id="login-password"
            name="password"
            class="form-control"
            placeholder="Your password"
            autocomplete="current-password"
            required
            aria-required="true"
            aria-describedby="login-password-error">
          <p id="login-password-error"
             class="form-error"
             role="alert"
             aria-live="polite"></p>
        </div>

        <!-- Forgot password link -->
        <div class="mt-3 text-right">
          <a href="/pages/forgot-password.html" class="text-sm">Forgot your password?</a>
        </div>

        <!-- Submit -->
        <div class="auth-form__actions">
          <button
            type="submit"
            id="login-submit-btn"
            class="btn btn--primary btn--full btn--lg">
            Sign In
          </button>
        </div>

      </form>

      <!-- Divider -->
      <div class="auth-divider mt-6">or</div>

      <!-- Register link -->
      <div class="auth-card__footer">
        Don't have an account?
        <a href="/pages/register.html" class="font-medium">Create one</a>
      </div>

    </div>

    <p class="auth-footer">
      &copy; 2026 Business Market Monitor
    </p>

  </main>

  <!-- Page module (Doc 3 §2.2 — type="module", deferred by spec) -->
  <script type="module" src="/js/pages/login.js"></script>

</body>
</html>
